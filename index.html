<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>Metrik Runs</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#272b35;--tx:#e8eaf0;--mut:#8b91a0;--acc:#4f8cff;--ok:#3ecf8e;--warn:#f5a524;--bad:#ef5350}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 90px}
header{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 10px}
nav{display:flex;gap:6px}
nav button{flex:1;min-height:42px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:10px;font-size:15px}
nav button.on{color:var(--tx);border-color:var(--acc);background:#1b2433}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
label{display:block;color:var(--mut);font-size:13px;margin:12px 0 6px}
textarea,input,select{width:100%;background:#0f1218;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;min-height:44px}
textarea{min-height:130px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);background:#0f1218;color:var(--tx);border-radius:10px;font-size:15px}
.seg button.on{border-color:var(--acc);background:#1b2433}
.seg button.on.ok{border-color:var(--ok);background:#12281f}
.seg button.on.bad{border-color:var(--bad);background:#2b1717}
.primary{width:100%;min-height:50px;margin-top:16px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:17px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}.mgrid label{margin:8px 0 4px}
details>summary{color:var(--mut);padding:12px 2px;cursor:pointer}
.chip{font-size:13px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.chip.ok{color:var(--ok);border-color:#1f4a38}.chip.bad{color:var(--bad);border-color:#5a2626}.chip.warn{color:var(--warn);border-color:#5a4318}
.banner{border:1px solid #5a4318;background:#241d0f;color:var(--warn);border-radius:12px;padding:10px 12px;margin:12px 0;font-size:14px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--mut)}
.tip{margin-top:10px;font-size:14px;color:#cdd3e0;border-left:3px solid var(--acc);padding-left:10px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper b{min-width:28px;text-align:center;font-size:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222833;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:14px;z-index:9}
small{color:var(--mut)}
button:disabled{opacity:.35}
.x{background:none;border:0;color:var(--mut);font-size:13px;padding:6px}
</style>
</head>
<body>
<div class="wrap">
<header><div class="row"><h1>Metrik Runs</h1><span id="sync" class="mut" style="font-size:12px"></span></div><nav id="tabs"></nav></header>
<main id="app"></main>
</div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
const KEY='metrik-runs-v1';
const DAY=864e5;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const T=iso=>new Date(iso).getTime();

const DEFAULT_TASKS=[
 {n:'LUKSO Update',d:1},{n:'Hup this week',d:7},{n:'Reply to my notifications',d:1},{n:'Join conversation',d:0},
 {n:'NFL daily',d:1},{n:'Football hot topic',d:1},{n:'Big match special',d:0},
 {n:'Community question',d:7},{n:'Creator spotlight',d:7},{n:'Daily brief',d:0}
];

function seed(){
 const r=(iso,task,outcome,pushes,result,extra)=>Object.assign({id:uid(),ts:T(iso),task,outcome,pushes,result,wrongSkip:false,memFail:false,note:''},extra||{});
 return{
  tasks:JSON.parse(JSON.stringify(DEFAULT_TASKS)),lastExport:null,
  runs:[
   r('2026-11-17T13:52:00+01:00','Hup this week','drafted',2,'discarded',{note:'Ignored the one-trending-post rule. Draft discarded, too soon after 15 Nov.'}),
   r('2026-11-17T21:58:00+01:00','LUKSO Update','skipped',0,'none',{wrongSkip:true,note:'Missed Updates #11-#13 and Predict v2.'}),
   r('2026-11-17T23:19:00+01:00','LUKSO Update','drafted',3,'edited',{note:'Length error once. Predict line added by hand.'}),
   r('2026-11-18T12:05:00+01:00','LUKSO Update','skipped',0,'none',{note:'Correct skip: security incident, not verifiable from its sources.'}),
   r('2026-11-18T23:00:00+01:00','LUKSO Update','drafted',0,'approved',{note:'Post mortem. Time and task approximate.'}),
   r('2026-11-19T23:32:00+01:00','LUKSO Update','drafted',1,'edited',{note:'Mini Radio and Ethereum stocks added by hand.'}),
   r('2026-11-20T00:03:00+01:00','Reply to my notifications','skipped',0,'none',{note:'Correct skip: comment had no question or fact.'})
  ]
 };
}
const SKEY='metrik-sync-v1';
function loadCfg(){try{const c=JSON.parse(localStorage.getItem(SKEY)||'null');if(c&&c.repo&&c.token)return c}catch(e){}return null}
let cfg=loadCfg();
function load(){
 try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&Array.isArray(s.runs)&&Array.isArray(s.tasks))return s}}catch(e){}
 if(cfg)return{tasks:JSON.parse(JSON.stringify(DEFAULT_TASKS)),runs:[],lastExport:null};
 return seed();
}
let S=load();
S.deleted=S.deleted||{};S.tu=S.tu||0;S.changes=S.changes||[];
if(!S.tasks.some(t=>t.n==='Join conversation')){S.tasks.splice(3,0,{n:'Join conversation',d:0})}
function migrateRename(from,to){
 const i=S.tasks.findIndex(t=>t.n===from);
 const used=S.runs.some(r=>r.task===from)||S.changes.some(c=>c.task===from);
 if(i<0&&!used)return false;
 const now=Date.now();
 if(i>=0){if(S.tasks.some(t=>t.n===to))S.tasks.splice(i,1);else S.tasks[i].n=to}
 else if(!S.tasks.some(t=>t.n===to))S.tasks.push({n:to,d:0});
 S.runs.forEach(r=>{if(r.task===from){r.task=to;r.u=now}});
 S.changes.forEach(c=>{if(c.task===from){c.task=to;c.u=now}});
 S.tu=now;
 return true;
}
function migrateTasks(){
 let did=false;
 const i=S.tasks.findIndex(t=>t.n==='Football weekly');
 if(i>=0){
  if(S.tasks.some(t=>t.n==='NFL daily'))S.tasks.splice(i,1);else S.tasks[i]={n:'NFL daily',d:1};
  S.tu=Date.now();
  const id='chg-nfl-daily';
  if(!S.deleted[id]&&!S.changes.some(c=>c.id===id))S.changes.push({id,ts:new Date('2026-11-25T23:30:00+01:00').getTime(),task:'NFL daily',text:'Football weekly dropped after 3 failed runs. Replaced by NFL daily: results from Sky when it states a score, news from Pro Football Talk.',u:Date.now()});
  did=true;
 }
 ['AI and science','AI and Science'].forEach(n=>{if(migrateRename(n,'Daily brief'))did=true});
 return did;
}
migrateTasks();
let editIdx=-1;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Browser storage blocked. Export a backup now.')}}
function save(){persist();schedulePush()}

/* ---------- GitHub sync ---------- */
const FILE='metrik-runs-data.json';
let syncBusy=false,syncAgain=false,syncTm=null,syncMsg='',lastSync=null,syncErr=false;
const runKey=r=>r.manual?r.id:r.ts+'|'+r.task;
function payload(s){return{tasks:s.tasks,runs:s.runs,changes:s.changes||[],deleted:s.deleted||{},tu:s.tu||0}}
function mergeState(a,b){
 const out={tasks:a.tasks,runs:[],changes:[],deleted:Object.assign({},a.deleted||{}),tu:a.tu||0,lastExport:a.lastExport||null};
 Object.entries(b.deleted||{}).forEach(([k,v])=>{out.deleted[k]=Math.max(out.deleted[k]||0,v)});
 if((b.tu||0)>(a.tu||0)&&Array.isArray(b.tasks)){out.tasks=b.tasks;out.tu=b.tu}
 const byId=new Map();
 [].concat(a.runs||[],b.runs||[]).forEach(r=>{if(!r||!r.id)return;const o=byId.get(r.id);if(!o||(r.u||0)>(o.u||0))byId.set(r.id,r)});
 const byKey=new Map();
 byId.forEach(r=>{
  if((out.deleted[r.id]||0)>=(r.u||0)&&out.deleted[r.id])return;
  const k=runKey(r),o=byKey.get(k);
  if(!o||(r.u||0)>(o.u||0))byKey.set(k,r);
 });
 out.runs=[...byKey.values()];
 const cb=new Map();
 [].concat(a.changes||[],b.changes||[]).forEach(c=>{if(!c||!c.id)return;const o=cb.get(c.id);if(!o||(c.u||0)>(o.u||0))cb.set(c.id,c)});
 out.changes=[...cb.values()].filter(c=>!((out.deleted[c.id]||0)>=(c.u||0)&&out.deleted[c.id]));
 return out;
}
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,''))));
async function gh(method,path,body){
 const r=await fetch('https://api.github.com/repos/'+cfg.repo+path,{method,cache:'no-store',
  headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'},
  body:body?JSON.stringify(body):undefined});
 let j=null;try{j=await r.json()}catch(e){}
 return{status:r.status,json:j};
}
function setStatus(m,err){syncMsg=m;syncErr=!!err;const el=$('#sync');if(el){el.textContent=m;el.style.color=err?'var(--bad)':''}}
function refreshStatus(){
 if(!cfg){setStatus('Local only');return}
 if(syncBusy)return setStatus('Syncing…');
 if(syncErr)return setStatus(syncMsg,true);
 setStatus(lastSync?'Synced '+new Date(lastSync).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'Not synced yet');
}
function schedulePush(){if(!cfg)return;clearTimeout(syncTm);syncTm=setTimeout(()=>sync(),1200)}
async function sync(){
 if(!cfg)return false;
 if(syncBusy){syncAgain=true;return false}
 syncBusy=true;syncErr=false;setStatus('Syncing…');
 let ok=false,changedLocal=false;
 try{
  for(let attempt=0;attempt<3;attempt++){
   const g=await gh('GET','/contents/'+FILE);
   let remote=null,sha;
   if(g.status===200&&g.json&&g.json.content){remote=JSON.parse(b64d(g.json.content));sha=g.json.sha}
   else if(g.status===404){
    const rp=await gh('GET','');
    if(rp.status!==200)throw new Error(rp.status===404?'Repo not found, or the token has no access to it':'Cannot read the repo ('+rp.status+')');
   }
   else if(g.status===401)throw new Error('Token rejected or expired');
   else if(g.status===403)throw new Error('Token lacks permission. Needs Contents: read and write');
   else throw new Error('GitHub error '+g.status);
   const before=JSON.stringify(payload(S));
   if(remote){const m=mergeState(S,remote);S=Object.assign(S,m);migrateTasks()}
   const after=JSON.stringify(payload(S));
   if(after!==before)changedLocal=true;
   persist();
   if(!remote||after!==JSON.stringify(payload(Object.assign({deleted:{},tu:0},remote)))){
    const body={message:'metrik runs sync',content:b64e(JSON.stringify(payload(S),null,1))};
    if(sha)body.sha=sha;
    const p=await gh('PUT','/contents/'+FILE,body);
    if(p.status===200||p.status===201){ok=true;break}
    if(p.status===409||p.status===422){continue}
    if(p.status===401)throw new Error('Token rejected or expired');
    if(p.status===403||p.status===404)throw new Error('Token cannot write to the repo. Needs Contents: read and write');
    throw new Error('GitHub error '+p.status);
   }else{ok=true;break}
  }
  if(!ok)throw new Error('Sync conflict, will retry');
  lastSync=Date.now();
 }catch(e){
  syncErr=true;
  syncMsg=(e&&e.message&&!/fetch|network|load failed/i.test(e.message))?e.message:'Offline, changes kept here and will sync later';
 }
 syncBusy=false;refreshStatus();
 if(changedLocal&&!editIdx_open()&&view!=='log')render();
 if(syncAgain){syncAgain=false;schedulePush()}
 return ok;
}
function editIdx_open(){return typeof editIdx!=='undefined'&&editIdx>=0}
window.addEventListener('online',()=>sync());
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='cdet')cOpen=e.target.open},true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cfg)sync()});
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ---------- classifier ---------- */
const TASK_RULES=[
 ['Join conversation',/join(ed|ing)? (a |the )?(conversations?|threads?)|no repl(y|ies) (qualif|fit)|giveaways/],

 ['NFL daily',/\bnfl\b|american football|super bowl|quarterback|touchdown|pro football talk/],
 ['Hup this week',/platform totals|root posts|nft feed|trending list|hup weekly/],
 ['LUKSO Update',/update #\d+|luksonews|lukso update|lyx is at|lyx price|read_prices/],
 ['Reply to my notifications',/comment|replied|reply to|notifications|propose_reply/],
 ['Big match special',/derby|cl[aá]sico|title clash|relegation|knockout/],
 ['Football hot topic',/bbc sport|sky sports|premier league|champions league|hot topic/],
 ['Community question',/community question/],
 ['Creator spotlight',/spotlight/],
 ['Daily brief',/\bscience\b|\bai news\b|daily brief|the verge|technology review|hugging face|bbc news/]
];
const RX={
 draftNoPropose:/(haven'?t|have not|hasn'?t|not yet)\s+(yet\s+)?(drafted|proposed|sent|called propose)/,
 drafted:/(waiting (on|for) (your )?approval|ready for (your )?approval|up for (your )?approval|up as a card|waiting for your approval|draft is up|proposed the post|proposed (a )?reply)/,
 stall:/(say the word|if you want me to|i can draft|can draft (one|that|it)|if you want( it| that| one)?[.,]?\s*$|i'?ll do both|next turn|task is incomplete|haven'?t (saved|drafted|proposed|sent)|before drafting|since you asked me not to)/,
 skip:/(not posting anything|not going to (post|draft|propose)|i'?d (rather )?skip|rather skip|i'?m skipping|skipping (it|this)|drafted nothing|drafted 0|didn'?t draft|did not draft|no [a-z ]{3,30} today|none qualif|nothing (new )?qualif|nothing new|skipped (it|this)|i'?m holding off|no new items)/,
 error:/(rejected|over the length|length limit|returned an error|failed|could not load)/,
 mem:/(memory not saved|couldn'?t save|save_memory failed|failed to save)/,
 unsaved:/(not saved yet|aren'?t saved yet|haven'?t saved|hasn'?t been saved)/
};
const grams=t=>{const w=t.toLowerCase().replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean);const s=new Set();for(let i=0;i<w.length-1;i++)s.add(w[i]+' '+w[i+1]);return s};
const jac=(a,b)=>{let i=0;a.forEach(x=>{if(b.has(x))i++});const u=a.size+b.size-i;return u?i/u:0};

function classify(text){
 const s=text.toLowerCase();
 // task is read from the story itself, not from sentences about notes or memory
 const body=text.split(/(?<=[.!?])\s+/).filter(x=>!/\b(notes?|memory|lines?|entries|saved|save_memory)\b/i.test(x)).join(' ').toLowerCase()||s;
 const g={task:null,outcome:'drafted',pushes:0,memFail:false,why:''};
 const why=[];
 for(const [name,rx] of TASK_RULES){if(rx.test(body)){g.task=name;break}}
 const m=k=>{const x=s.match(RX[k]);return x?x[0]:null};
 const dn=m('draftNoPropose'),dr=m('drafted'),st=m('stall'),sk=m('skip'),er=m('error'),me=m('mem'),us=m('unsaved');
 if(dr&&!dn){g.outcome='drafted';why.push('draft card: "'+dr+'"')}
 else if(sk&&!/(say the word|if you want me to|i can draft|can draft (one|that|it)|if you want( it| that| one)?[.,]?\s*$|i'?ll do both|next turn|task is incomplete|before drafting|since you asked me not to)/.test(s.trim())){g.outcome='skipped';why.push('skip: "'+sk+'"')}
 else if(dn||st){g.outcome='drafted';g.pushes=1;why.push('stalled: "'+(dn||st)+'"')}
 else why.push('no clear phrase, check the outcome');
 if(er){if(dr||sk){why.push('error seen but it recovered: "'+er+'"')}else{why.push('error: "'+er+'"');g.outcome='error'}}
 if(us&&!g.pushes&&g.outcome==='drafted'){g.pushes=1;why.push('save step not done: "'+us+'"')}
 if(me){g.memFail=true;why.push('memory: "'+me+'"')}
 // learn from runs the user corrected before
 const gs=grams(text);let best=0,hit=null;
 S.runs.forEach(r=>{if(r.corrected&&r.text&&S.tasks.some(t=>t.n===r.task)){const j=jac(gs,grams(r.text));if(j>best){best=j;hit=r}}});
 if(hit&&best>=0.45){g.task=hit.task;g.outcome=hit.outcome;g.pushes=hit.pushes>0?1:0;why.unshift('matches a run you corrected on '+new Date(hit.ts).toLocaleDateString())}
 g.why=why.join(' · ');
 return g;
}

/* ---------- state ---------- */
let view='log',win=14,tm=null,hp=0,hf='',ff=null,eid=null,ed=null,rw=30,mid=null,cid=null,cf={task:'',text:'',ts:null},rs='all',ml=15,cOpen=false,cl=5,pf=null,pid=null,le=null,lf={link:'',note:''};const PER=10;
let draft=newDraft();
function newDraft(){return{ts:Date.now(),task:'',outcome:'drafted',pushes:0,result:'pending',wrongSkip:false,memFail:false,note:'',link:'',text:'',guess:null,why:''}}
function applyGuess(){
 if(!draft.text.trim()){draft.guess=null;draft.why='';return}
 const g=classify(draft.text);draft.guess=g;
 if(g.task)draft.task=g.task;
 draft.outcome=g.outcome;draft.pushes=g.pushes;draft.memFail=g.memFail;draft.why=g.why;
 draft.result=g.outcome==='drafted'?'pending':'none';
}

/* ---------- helpers ---------- */
const fmt=ts=>new Date(ts).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const localVal=ts=>{const d=new Date(ts);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const isClean=r=>r.pushes===0&&!r.wrongSkip&&!r.memFail&&r.outcome!=='error';
function seg(field,opts,val,cls){return '<div class="seg">'+opts.map(([v,l,c])=>`<button class="${val===v?'on '+(c||''):''}" data-a="set:${field}:${v}">${l}</button>`).join('')+'</div>'}
function overdue(){
 const out=[],now=Date.now();
 S.tasks.forEach(t=>{
  if(!t.d)return;
  const mine=S.runs.filter(r=>r.task===t.n&&!r.manual);
  if(!mine.length)return;
  const last=Math.max(...mine.map(r=>r.ts)),days=(now-last)/DAY;
  if(days>t.d*1.5)out.push({n:t.n,days:Math.floor(days)});
 });
 return out;
}

/* ---------- views ---------- */
function render(){
 $('#tabs').innerHTML=[['log','Log'],['health','Health'],['history','History'],['review','Review'],['setup','Setup']]
  .map(([k,l])=>`<button data-a="tab:${k}" class="${view===k?'on':''}">${l}</button>`).join('');
 ({log:rLog,health:rHealth,history:rHistory,review:rReview,setup:rSetup})[view]();
}
function rLog(){
 let b='';
 const od=overdue();
 if(od.length)b+=`<div class="banner">Nothing logged lately: ${od.map(o=>esc(o.n)+' ('+o.days+'d)').join(', ')}</div>`;
 const age=S.lastExport?(Date.now()-S.lastExport)/DAY:null;
 if(S.runs.length&&(age===null||age>7))b+=`<div class="banner">No backup in ${age===null?'a while':Math.floor(age)+' days'}. Setup, then Export.</div>`;
 $('#app').innerHTML=b+`<div class="card"><label style="margin-top:0">Paste Metrik's reply</label><textarea id="paste" placeholder="Long-press, paste. It reads the rest."></textarea></div><div id="panel"></div>`;
 $('#paste').value=draft.text;
 rPanel();
}
function rPanel(){
 const el=$('#panel');if(!el)return;
 const taskOpts='<option value="">Pick a task</option>'+S.tasks.map(t=>`<option ${t.n===draft.task?'selected':''}>${esc(t.n)}</option>`).join('');
 el.innerHTML=`<div class="card">
 ${draft.why?`<p class="mut" style="margin:0">Read: ${esc(draft.why)}</p>`:''}
 <label>Task</label><select id="taskSel">${taskOpts}</select>
 <label>Outcome</label>${seg('outcome',[['drafted','Drafted'],['skipped','Skipped'],['error','Error','bad']],draft.outcome)}
 <label>Pushes I had to send</label>
 <div class="stepper"><button class="btn" data-a="push:-1">−</button><b>${draft.pushes}</b><button class="btn" data-a="push:1">+</button></div>
 ${draft.outcome==='drafted'?`<label>What I did with the draft</label>${seg('result',[['pending','Not yet'],['approved','Approved','ok'],['edited','Edited'],['discarded','Discarded','bad']],draft.result)}`:''}
 ${draft.outcome==='skipped'?`<label>Was the skip right?</label>${seg('wrongSkip',[['false','Right','ok'],['true','Wrong','bad']],String(draft.wrongSkip))}`:''}
 <label>Memory save failed?</label>${seg('memFail',[['false','No'],['true','Yes','bad']],String(draft.memFail))}
 <label>When</label><input type="datetime-local" id="when" value="${localVal(draft.ts)}">
 <label>Note (optional)</label><input id="note" value="${esc(draft.note)}" placeholder="e.g. ignored the 350 limit">
 <label>Post link (optional, can be added later in Review)</label><input id="plink" value="${esc(draft.link||'')}" placeholder="hup.social/networks/42/12345" autocapitalize="none" autocorrect="off">

function inWin(r){return win===0||r.ts>=Date.now()-win*DAY}
function agg(runs){
 const n=runs.length,drafts=runs.filter(r=>r.outcome==='drafted');
 return{n,
  clean:runs.filter(isClean).length,
  pushes:runs.reduce((a,r)=>a+r.pushes,0),
  stalled:runs.filter(r=>r.pushes>0).length,
  wrong:runs.filter(r=>r.wrongSkip).length,
  mem:runs.filter(r=>r.memFail).length,
  err:runs.filter(r=>r.outcome==='error').length,
  drafts:drafts.length,
  disc:drafts.filter(r=>r.result==='discarded').length,
  edited:drafts.filter(r=>r.result==='edited').length,
  pend:drafts.filter(r=>r.result==='pending').length};
}
function tips(a){
 const t=[];
 if(a.n>=2&&a.stalled/a.n>=0.5)t.push(`Stalls in ${a.stalled} of ${a.n} runs. Fewer steps, one tool call per step, exact tool names. Test in a New chat.`);
 if(a.wrong)t.push('Wrong skip. Add a step that makes it list the items it checked before it decides to skip.');
 if(a.drafts>=2&&a.disc/a.drafts>=0.4)t.push('Many drafts discarded. Compare them with the rule they broke and put that rule into the task text.');
 if(a.drafts>=2&&a.edited/a.drafts>=0.5)t.push('Most drafts need hand edits. Note what you change each time. A repeat edit is a missing rule.');
 if(a.mem)t.push('Memory saves failed. Check MEMORY.md against the 12-line cap.');
 if(!t.length&&a.n>=3&&a.clean/a.n>=0.8)t.push('Healthy.');
 return t;
}

 const learned=S.runs.filter(r=>r.corrected).length;
 $('#app').innerHTML=`<div class="card"><b>Tasks</b><p class="mut" style="margin:4px 0 0">Days between runs. 0 means no schedule, so no overdue alert.</p>
 ${S.tasks.map((t,i)=>i===editIdx?`<div style="margin-top:10px;border:1px solid var(--acc);border-radius:12px;padding:10px"><input id="en" value="${esc(t.n)}"><div class="row" style="margin-top:8px;gap:8px"><input id="ed" type="number" min="0" value="${t.d}" style="width:90px"><span class="mut">days between runs</span></div><div class="seg" style="margin-top:10px"><button class="on ok" data-a="tsave:${i}">Save</button><button data-a="tcancel">Cancel</button><button data-a="deltask:${i}" style="margin-left:auto;color:var(--bad)">Delete</button></div></div>`:`<div class="row" style="margin-top:10px;gap:8px"><div><b>${esc(t.n)}</b><div class="mut">${t.d?'every '+t.d+(t.d===1?' day':' days'):'no schedule'}</div></div><button class="btn" data-a="tedit:${i}">Edit</button></div>`).join('')}
 <button class="btn" style="margin-top:12px" data-a="addtask">Add task</button></div>
 <div class="card"><b>Sync</b>${cfg?`<p class="mut" style="margin:4px 0 10px">Connected to <b>${esc(cfg.repo)}</b>. ${esc(syncMsg)}.</p><div class="seg"><button data-a="syncnow">Sync now</button><button data-a="disconnect">Disconnect</button></div>`:`<p class="mut" style="margin:4px 0 0">Saves your log to a private GitHub repo so it survives a cleared browser and works on every device. Use a <b>private</b> repo.</p><label>Repo (owner/name)</label><input id="sr" placeholder="mikkyprestige/metrik-data" autocapitalize="none" autocorrect="off"><label>Access token</label><input id="st" type="password" placeholder="github_pat_..." autocomplete="off"><p class="mut" style="margin:6px 0 0">Fine-grained token, only that repo, Contents: read and write. It stays in this browser and is never exported.</p><button class="primary" style="margin-top:12px" data-a="connect">Connect and sync</button>`}</div>
 <div class="card"><b>Backup</b><p class="mut" style="margin:4px 0 10px">Your data is kept in this browser${cfg?" and in your repo":""}. Export to a file and keep it in Drive or email it to yourself.</p>
 <div class="seg"><button data-a="export">Export file</button><button data-a="copy">Copy as text</button><button data-a="import">Import file</button></div>
 <p class="mut" style="margin:10px 0 0">Last export: ${S.lastExport?new Date(S.lastExport).toLocaleString():'never'}</p></div>
 <div class="card"><b>Learning</b><p class="mut" style="margin:4px 0 0">${learned} corrected run${learned===1?'':'s'} stored. When you fix a guess, the app remembers that reply and matches similar ones next time.</p>
 <button class="x" style="margin-top:8px" data-a="reset">Erase everything</button></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const [a,x,y]=b.dataset.a.split(':');
 if(a==='tab'){view=x;eid=null;mid=null;if(x==='history'){hp=0;hf=''}render()}
 else if(a==='freq'){ff=x==='all'?null:Number(x);hp=0;if(view==='health')rHealth();else if(view==='review')rReview();else rHistory()}
 else if(a==='rwin'){rw=Number(x);rReview()}
 else if(a==='rset'){rs=x;rReview()}
 else if(a==='mmore'){ml+=15;rReview()}
 else if(a==='cmore'){cl+=10;cOpen=true;rReview()}
 else if(a==='ledit'){const r=S.runs.find(r=>r.id===x);if(r){le=x;lf={link:r.link||'',note:r.note||''};rReview()}}
 else if(a==='lcancel'){le=null;rReview()}
 else if(a==='lsave'){const r=S.runs.find(r=>r.id===le);if(r){const lk=normLink(lf.link);if(lk)r.link=lk;else delete r.link;r.note=lf.note.trim();r.u=Date.now();save()}le=null;toast('Saved');rReview()}
 else if(a==='padd'){pf=newPf();pid=null;rReview()}
 else if(a==='pcancel'){pf=null;pid=null;rReview()}
 else if(a==='pold'){pf.old=(x==='1');rReview()}
 else if(a==='psave')savePost(false);
 else if(a==='pnext')savePost(true);
 else if(a==='pedit'){const r=S.runs.find(r=>r.id===x);if(r){const m={};if(r.m)MK.forEach(k=>{m[k]=String(r.m[k]||0)});pf={task:r.task,ts:r.ts,link:r.link||'',note:r.note||'',old:!!r.old,m};pid=x;rReview();window.scrollTo(0,0)}}
 else if(a==='pdel'){if(confirm('Delete this post?')){S.deleted[x]=Date.now();S.runs=S.runs.filter(r=>r.id!==x);if(pid===x){pf=null;pid=null}save();rReview()}}
 else if(a==='mclear'){const r=S.runs.find(r=>r.id===x);if(r&&confirm('Clear the numbers for this post?')){delete r.m;r.u=Date.now();save();rReview()}}
 else if(a==='mopen'){mid=x;rReview()}
 else if(a==='mcancel'){mid=null;rReview()}
 else if(a==='msave'){
  const r=S.runs.find(r=>r.id===x);if(!r)return;const m={};
  document.querySelectorAll('[data-rid="'+x+'"]').forEach(i=>{m[i.dataset.k]=num(i.value)});
  MK.forEach(k=>{if(m[k]===undefined)m[k]=0});
  ['likes','comments','reposts','views','tippers'].forEach(k=>{m[k]=Math.round(m[k])});
  m.at=Date.now();r.m=m;r.u=Date.now();mid=null;save();toast('Saved');rReview();
 }
 else if(a==='csave'){
  if(!(cf.text||'').trim()){toast('Write what you are changing');return}
  const ts=cf.ts||Date.now();
  if(cid){const c=S.changes.find(c=>c.id===cid);if(c){c.task=cf.task;c.text=cf.text.trim();c.ts=ts;c.u=Date.now()}}
  else S.changes.push({id:uid(),ts,task:cf.task,text:cf.text.trim(),u:Date.now()});
  cid=null;cf={task:'',text:'',ts:null};cOpen=true;save();toast('Saved');rReview();
 }
 else if(a==='ccancel'){cid=null;cf={task:'',text:'',ts:null};rReview()}
 else if(a==='cedit'){const c=S.changes.find(c=>c.id===x);if(c){cid=x;cf={task:c.task||'',text:c.text,ts:c.ts};rReview();window.scrollTo(0,0)}}
 else if(a==='cdel'){if(confirm('Delete this entry?')){S.deleted[x]=Date.now();S.changes=S.changes.filter(c=>c.id!==x);save();rReview()}}
 else if(a==='edit'){const r=S.runs.find(r=>r.id===x);if(r){ed={...r};eid=x;rHistory()}}
 else if(a==='ecancel'){eid=null;ed=null;rHistory()}
 else if(a==='eset'){
  if(x==='wrongSkip'||x==='memFail')ed[x]=(y==='true');
  else{ed[x]=y;if(x==='outcome'){ed.result=y==='drafted'?(ed.result&&ed.result!=='none'?ed.result:'pending'):'none';if(y!=='skipped')ed.wrongSkip=false}}
  rHistory();
 }
 else if(a==='epush'){ed.pushes=Math.max(0,ed.pushes+Number(x));rHistory()}
 else if(a==='esave'){
  const r=S.runs.find(r=>r.id===eid);if(!r||!ed.task){toast('Pick a task');return}
  r.task=ed.task;r.outcome=ed.outcome;r.pushes=ed.pushes;
  r.result=ed.outcome==='drafted'?ed.result:'none';
  r.wrongSkip=ed.outcome==='skipped'&&!!ed.wrongSkip;r.memFail=!!ed.memFail;
  r.ts=ed.ts;r.note=(ed.note||'').trim();{const lk=normLink(ed.link);if(lk)r.link=lk;else delete r.link}r.u=Date.now();
  eid=null;ed=null;save();toast('Saved');rHistory();
 }
 else if(a==='hpage'){hp+=Number(x);rHistory();window.scrollTo(0,0)}
 else if(a==='set'){
  if(x==='wrongSkip'||x==='memFail')draft[x]=(y==='true');
  else{draft[x]=y;if(x==='outcome'){draft.result=y==='drafted'?'pending':'none';if(y!=='skipped')draft.wrongSkip=false}}
  rPanel();
 }
 else if(a==='push'){draft.pushes=Math.max(0,draft.pushes+Number(x));rPanel()}
 else if(a==='save')saveRun();
 else if(a==='win'){win=Number(x);rHealth()}
 else if(a==='res'){const r=S.runs.find(r=>r.id===x);if(r){r.result=y;r.u=Date.now();save();rHistory()}}
 else if(a==='del'){if(confirm('Delete this run?')){S.deleted[x]=Date.now();S.runs=S.runs.filter(r=>r.id!==x);save();rHistory()}}
 else if(a==='addtask'){S.tu=Date.now();S.tasks.push({n:'New task',d:0});editIdx=S.tasks.length-1;save();rSetup()}
 else if(a==='tedit'){editIdx=Number(x);rSetup()}
 else if(a==='tcancel'){editIdx=-1;rSetup()}
 else if(a==='tsave'){const t=S.tasks[Number(x)],nn=($('#en').value||'').trim(),old=t.n;if(!nn){toast('Name needed');return}
  if(S.tasks.some((o,j)=>j!==Number(x)&&o.n===nn)){toast('Name already used');return}
  t.n=nn;t.d=Math.max(0,Number($('#ed').value)||0);S.tu=Date.now();S.runs.forEach(r=>{if(r.task===old){r.task=nn;r.u=Date.now()}});editIdx=-1;save();toast('Saved');rSetup()}
 else if(a==='deltask'){if(confirm('Delete this task? Logged runs stay.')){S.tu=Date.now();S.tasks.splice(Number(x),1);editIdx=-1;save();rSetup()}}
 else if(a==='export')doExport();
 else if(a==='copy'){const t=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{S.lastExport=Date.now();save();toast('Copied');rSetup()}).catch(()=>toast('Copy blocked. Use Export file.'))}
 else if(a==='import')$('#file').click();
 else if(a==='reset'){if(confirm('Erase all runs and tasks'+(cfg?' here and in your repo':'')+'? Export first.')){const d=Object.assign({},S.deleted),now=Date.now();S.runs.forEach(r=>{d[r.id]=now});(S.changes||[]).forEach(c=>{d[c.id]=now});S={tasks:JSON.parse(JSON.stringify(DEFAULT_TASKS)),runs:[],changes:[],lastExport:null,deleted:d,tu:now};save();rSetup()}}
 else if(a==='syncnow'){sync().then(ok=>{toast(ok?'Synced':syncMsg);rSetup()})}
 else if(a==='disconnect'){if(confirm('Disconnect? Data stays here and in the repo. The token is removed from this browser.')){cfg=null;try{localStorage.removeItem(SKEY)}catch(e){}refreshStatus();rSetup()}}
 else if(a==='connect'){
  const repo=($('#sr').value||'').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,''),token=($('#st').value||'').trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){toast('Repo must look like owner/name');return}
  if(!token){toast('Paste the token');return}
  cfg={repo,token};
  toast('Connecting…');
  sync().then(ok=>{
   if(ok){try{localStorage.setItem(SKEY,JSON.stringify(cfg))}catch(e){}toast('Connected and synced')}
   else{const m=syncMsg;cfg=null;syncErr=false;refreshStatus();toast(m)}
   rSetup();
  });
 }
});
document.addEventListener('input',e=>{
 const id=e.target.id;
 if(id==='paste'){clearTimeout(tm);tm=setTimeout(()=>{draft.text=e.target.value;applyGuess();rPanel()},350)}
 else if(id==='note')draft.note=e.target.value;
 else if(id==='plink')draft.link=e.target.value;
 else if(id==='e-note'&&ed)ed.note=e.target.value;
 else if(id==='e-link'&&ed)ed.link=e.target.value;
 else if(id==='c-text')cf.text=e.target.value;
 else if(id==='l-link')lf.link=e.target.value;
 else if(id==='l-note')lf.note=e.target.value;
 else if(id==='p-link'&&pf)pf.link=e.target.value;
 else if(id==='p-note'&&pf)pf.note=e.target.value;
 else if(e.target.dataset&&e.target.dataset.pk&&pf)pf.m[e.target.dataset.pk]=e.target.value;
});
document.addEventListener('change',e=>{
 const id=e.target.id;
 if(id==='hf'){hf=e.target.value;hp=0;rHistory()}
 else if(id==='e-task'&&ed)ed.task=e.target.value;
 else if(id==='c-task')cf.task=e.target.value;
 else if(id==='p-task'&&pf)pf.task=e.target.value;
 else if(id==='p-when'&&pf){const t=new Date(e.target.value).getTime();if(!isNaN(t)){pf.ts=t;rReview()}}
 else if(id==='c-when'){const t=new Date(e.target.value).getTime();if(!isNaN(t))cf.ts=t}
 else if(id==='e-when'&&ed){const t=new Date(e.target.value).getTime();if(!isNaN(t))ed.ts=t}
 else if(id==='taskSel')draft.task=e.target.value;
 else if(id==='when'){const t=new Date(e.target.value).getTime();if(!isNaN(t))draft.ts=t}
 else if(id==='file'){
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{
   const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.runs))throw 0;
   const have=new Set(S.runs.map(r=>r.id));let add=0;
   d.runs.forEach(r=>{if(r&&r.id&&!have.has(r.id)&&!(S.deleted[r.id])){r.u=r.u||Date.now();S.runs.push(r);add++}});
   if(Array.isArray(d.tasks))d.tasks.forEach(t=>{if(t&&t.n&&!S.tasks.some(x=>x.n===t.n))S.tasks.push(t)});
   if(Array.isArray(d.changes))d.changes.forEach(c=>{if(c&&c.id&&!S.changes.some(x=>x.id===c.id)&&!S.deleted[c.id]){c.u=c.u||Date.now();S.changes.push(c)}});
   save();toast('Imported '+add+' runs');render();
  }catch(err){toast('That file is not a Metrik Runs backup')}e.target.value=''};
  rd.readAsText(f);
 }
});
function saveRun(){
 if(!draft.task){toast('Pick a task first');return}
 const g=draft.guess;
 const corrected=!!(g&&draft.text&&(g.task!==draft.task||g.outcome!==draft.outcome||(g.pushes>0)!==(draft.pushes>0)));
 const r={id:uid(),ts:draft.ts,task:draft.task,outcome:draft.outcome,pushes:draft.pushes,
  result:draft.outcome==='drafted'?draft.result:'none',
  wrongSkip:draft.outcome==='skipped'&&draft.wrongSkip,memFail:draft.memFail,note:draft.note.trim()};
 const lk=normLink(draft.link);if(lk)r.link=lk;
 if(corrected){r.corrected=true;r.text=draft.text.slice(0,600)}
 r.u=Date.now();S.runs.push(r);save();draft=newDraft();toast('Saved');render();
}
function doExport(){
 try{
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='metrik-runs-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  S.lastExport=Date.now();save();rSetup();
 }catch(e){toast('Export blocked. Use Copy as text.')}
}
persist();render();refreshStatus();if(cfg)sync();
</script>
</body>
